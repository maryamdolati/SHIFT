[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "shift-krno"
version = "0.1.0"
description = "Auditable SHIFT forecasting experiments with explicit KRNO benchmark contracts"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.26", "pandas>=1.5.3", "scipy>=1.10"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
shift-run = "shift_krno.run:main"
[tool.setuptools.packages.find]
where = ["krno"]
[tool.pytest.ini_options]
testpaths = ["tests"]
